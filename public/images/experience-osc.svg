<svg width="500" height="706" viewBox="0 0 500 706" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a52;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a1a2a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="500" height="706" fill="url(#bgGradient)" />
  
  <!-- Border -->
  <rect x="0" y="0" width="500" height="706" fill="none" stroke="#dc2626" stroke-width="2" />
  
  <!-- Decorative elements -->
  <line x1="20" y1="80" x2="480" y2="80" stroke="#dc2626" stroke-width="1" opacity="0.3" />
  <line x1="20" y1="626" x2="480" y2="626" stroke="#dc2626" stroke-width="1" opacity="0.3" />
  
  <!-- Text content -->
  <text x="250" y="100" font-family="monospace" font-size="28" font-weight="bold" fill="#dc2626" text-anchor="middle">
    OSC 2025
  </text>
  
  <text x="250" y="150" font-family="monospace" font-size="18" fill="#e5e5e5" text-anchor="middle">
    Linux System Administration
  </text>
  
  <text x="250" y="200" font-family="monospace" font-size="16" fill="#b0b0b0" text-anchor="middle">
    PIC - Person in Charge
  </text>
  
  <!-- Description -->
  <text x="50" y="300" font-family="monospace" font-size="12" fill="#b0b0b0">
    <tspan x="50" dy="20">Infrastructure Management</tspan>
    <tspan x="50" dy="20">Competition Design</tspan>
    <tspan x="50" dy="20">Evaluation & Selection</tspan>
  </text>
  
  <!-- Terminal-like decorative icons -->
  <circle cx="100" cy="550" r="4" fill="#dc2626" />
  <circle cx="120" cy="550" r="4" fill="#dc2626" />
  <circle cx="140" cy="550" r="4" fill="#dc2626" />
  
  <!-- Period -->
  <text x="50" y="650" font-family="monospace" font-size="11" fill="#808080">
    07/2025 – 08/2025
  </text>
</svg>
